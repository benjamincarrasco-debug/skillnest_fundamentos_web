<!--tarea formulario: crear un formulario de registro para resevar un sitio web para reservar una hora al doctor. Debe incluir: Nombre del paciente, Ciudad (lista_desp) casilla de verificacion-->
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservas</title>
</head>

<body>
    <h1 style="display: contents;">bienvrenido rellene este formulario</h1>
    <hr><br>
    <form action="#" method="POST">
        <label or="nombre">Nombre del paciente:</label>
        <input type="text" id="nombre" name="nombre">
        <br><br>
        <label for="fecha_nacimiento">Fecha de nacimiento:</label>
        <input type="date" id="fecha_nacimiento" name="fecha_nacimiento">
        <br><br>
        <label form="ciudad">Ciudad: </label>
        <select id="ciudad" name="ciudad">
            <option>Santiago</option>
            <option>Valparaiso</option>
            <option>Temuco</option>
            <option>viña del mar</option>
        </select>
        <br><br>
         <label for="fecha_reserva">Fecha de reserva:</label>
        <input type="date" id="fecha_reserva" name="fecha_reserva">
        <label> </label>

    </form>
</body>

</html>
