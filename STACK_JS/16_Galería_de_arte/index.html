<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Art Gallery</title>
  <link rel="stylesheet" href="static/css/style.css">
</head>
<body>

  <header class="navbar">
    <h1 class="logo">The Art Gallery</h1>
    <input type="text" class="search-input" placeholder="Buscar arte...">
    <button class="login-btn">Iniciar sesión</button>
  </header>

  <main class="container">
    <div class="art-card">
      <div class="image-wrapper">
        <img id="campo" src="static/images/campo-de-trigo-con-cipreses.png">
      </div>
      <p class="caption">Campo de trigo con cipreses, Vincent van Gogh (1889)</p>
    </div>
  </main>

  <script src="static/js/script.js"></script>
</body>
</html>
