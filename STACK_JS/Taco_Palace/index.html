<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Benjamin Carrasco">
    <title>Taco Palace</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>

<body>
    <header>
        <nav class="navbar">
            <div class="takito">
                <img src="static/images/logo.png" alt="taco" class="logo">
                <h1><span class="taco">Taco</span>Palace</h1>
            </div>
            <div class="compra">
                <div class="gmail">
                    <input id="gmail" type="text" placeholder="email"><button id="loginn">Login</button>
                </div>
                <img src="static/images/carrito.png" alt="carro" class="carro">
                <h2 class="numerp" id="carrito">0</h2>
            </div>
        </nav>
    </header>
    <main class="container">
        <section class="comida">
            <div class="plato">
                <img src="static/images/enchiladas.jpg" alt="enchiladas" class="comidi">
                <p>Enchiladas</p>
            </div>

            <div class="plato">
                <img src="static/images/tacos.jpg" alt="tacos" class="comidi">
                <p>Tacos</p>
            </div>

            <div class="plato">
                <img src="static/images/flautas.jpg" alt="flautas" class="comidi">
                <p>Flautas</p>
            </div>

            <div class="plato">
                <img src="static/images/gorditas.jpg" alt="gorditas" class="comidi">
                <p>Gorditas</p>
            </div>

            <div class="plato">
                <img src="static/images/tostadas.jpg" alt="tostadas" class="comidi">
                <p>Tostadas</p>
            </div>

            <div class="plato">
                <img src="static/images/enfrijoladas.jpg" alt="enfrijoladas" class="comidi">
                <p>Enfrijoladas</p>
            </div>
        </section>




        <section class="explorar">
            <div class="parteGrande">
                <div class="desc">
                    <p>La mejor <br> variedad en <br> platillos de comida <br>
                        <strong>mexicana</strong>
                    </p>
                    <p class="chiki">Contamos con <a href="#">servicio</a> a <br> <span class="nara">domicilio</span>
                    </p>
                </div>
                <div class="fotoCambia">
                    <img src="static/images/comida-mexicana.jpg" alt="comida-mexicana" class="cambia" id="foto">
                </div>

            </div>
            <div class="partePequena">
                <h2>Recomdendados:</h2>

                <div class="orden">
                    <img src="static/images/orden-tacos.jpg" alt="tacos" class="fotoOrden">
                    <div class="infoOrden">
                        <div class="oden">
                            <p>Orden de Tacos</p>
                            <a href="#">Ver mas...</a>
                        </div>

                        <div class="botn">
                            <button id="anadir">+</button>
                        </div>
                    </div>
                </div>

                <div class="orden">
                    <img src="static/images/orden-flautas.jpg" alt="flautas" class="fotoOrden">
                    <div class="infoOrden">
                        <div class="oden">
                            <p>Orden de Flautas</p>
                            <a href="#">Ver mas...</a>
                        </div>

                        <div class="botn">
                            <button id="anadir2">+</button>
                        </div>
                    </div>
                </div>

            </div>
        </section>
    </main>
    <script src="static/js/script.js"></script>
</body>

</html>
