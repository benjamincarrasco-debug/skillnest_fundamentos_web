<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Yopo">
    <link rel="stylesheet" href="static/css/style.css">
    <title>Ejemplo mini-stio inline-bloc</inline>
    </title>
</head>

<body>
    <!--Header-->
    <header class="header">
        <h1>Mi sitio web</h1>
        <nav class="menu"> <!--Mwnu navegacion-->
            <a href="#" class="boton">Inicio</a>
            <a href="#" class="boton">servicios</a>
            <a href="#" class="boton">contacto</a>
        </nav>
    </header>
    <main class="contenedor_principal">
        <!--texto con elemntos inline-->
        <section>
            <h2>Texto con elemtos inline</h2>
            <p>
                Este es un ejemplo donde <span class="resaltado">inline</span> para resaltar texto sin romper la linea de parrafo.
            </p>
        </section>
        <!--Tarjetas (inline-block)-->
        <section class="contenedor_tarjetas">
            <h2>tarjeta (inline-block)</h2>
            <div class="box">tarjeta 1</div>
            <div class="box">tarjeta 2</div>
            <div class="box">tarjeta 3</div>
        </section>
        <!--Bloques (block)-->
        <section>
            <h2>Bloques (block)</h2>
            <div class="bloque">bloque 1</div>
            <div class="bloque">bloque 2</div>
            <div class="bloque">bloque 3</div>
    </main>
    <footer class="footer">
        <p>2026 - todos los derechos resevados</p>
    </footer>
</body>

</html>
